<div class="flex h-screen bg-slate-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex-col hidden md:flex">
    <div class="h-16 flex items-center justify-center border-b border-slate-700">
      <h1 class="text-xl font-bold tracking-wider uppercase">Jamine ERP</h1>
    </div>
    
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
      <a routerLink="/admin/dashboard" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Dashboard
      </a>
      
      <!-- Role: Admin, Purchasing, Sales, Warehouse can see Products -->
      <a *ngIf="hasRole(['Admin', 'Purchasing', 'Sales', 'Warehouse'])" routerLink="/admin/products" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        Products
      </a>

      <!-- Role: Admin, Purchasing -->
      <a *ngIf="hasRole(['Admin', 'Purchasing'])" routerLink="/admin/purchase-orders" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        Purchase Orders
      </a>

      <!-- Role: Admin, Sales -->
      <a *ngIf="hasRole(['Admin', 'Sales'])" routerLink="/admin/sales-orders" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
        Sales Orders
      </a>

      <!-- Warehouse only handles PO Details & SO Details, so they don't have separate sidebar links for now. -->

      <div *ngIf="hasRole(['Admin', 'Sales', 'Purchasing'])" class="pt-4 pb-2">
        <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Contacts</p>
      </div>
      
      <!-- Role: Admin, Sales -->
      <a *ngIf="hasRole(['Admin', 'Sales'])" routerLink="/admin/customers" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        Customers
      </a>
      
      <!-- Role: Admin, Purchasing -->
      <a *ngIf="hasRole(['Admin', 'Purchasing'])" routerLink="/admin/suppliers" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        Suppliers
      </a>

      <div *ngIf="hasRole(['Admin'])" class="pt-4 pb-2">
        <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Settings</p>
      </div>

      <!-- Role: Admin -->
      <a *ngIf="hasRole(['Admin'])" routerLink="/admin/users" routerLinkActive="bg-blue-600 text-white" class="text-slate-300 hover:bg-slate-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
        <svg class="mr-3 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        User Management
      </a>

    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b border-slate-200">
      <div class="flex items-center gap-4">
        <h2 class="text-xl font-semibold text-slate-800">Admin Portal</h2>
        <a routerLink="/" class="text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 transition-colors">
          <i class="fas fa-external-link-alt"></i> เปิดหน้าร้านค้า
        </a>
      </div>
      
      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-600">
          Welcome, <strong>{{ authService.currentUser()?.username }}</strong> 
          <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded ml-2">{{ authService.currentUser()?.role }}</span>
        </span>
        <button (click)="logout()" class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
          Logout
        </button>
      </div>
    </header>

    <!-- Page Content (Router Outlet) -->
    <div class="flex-1 overflow-auto bg-slate-50 p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
