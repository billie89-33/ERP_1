<div class="min-h-screen w-full bg-slate-900 flex items-center justify-center relative overflow-hidden font-sans">
    
  <!-- Animated background blobs -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600/30 blur-[100px] animate-pulse"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-blue-600/30 blur-[120px] animate-pulse" style="animation-delay: 2s"></div>

  <!-- Glass Modal -->
  <div class="relative z-10 w-full max-w-lg p-10 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl min-h-[620px] flex flex-col">
    
    <div class="flex justify-center mb-8">
      <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-xl flex items-center justify-center text-white text-2xl font-bold shadow-lg">J</div>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="mb-6 bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-sm font-medium text-center">
      {{ error }}
    </div>

    <!-- Tab Switcher -->
    <div class="flex justify-center mb-8 border-b border-white/10 pb-4 space-x-8">
      <button (click)="toggleMode('login')" 
              [ngClass]="isLoginMode ? 'text-white font-bold text-lg border-b-2 border-blue-400 pb-1' : 'text-white/50 font-medium text-lg hover:text-white pb-1 transition'">
        Log In
      </button>
      <button (click)="toggleMode('register')" 
              [ngClass]="!isLoginMode ? 'text-white font-bold text-lg border-b-2 border-blue-400 pb-1' : 'text-white/50 font-medium text-lg hover:text-white pb-1 transition'">
        Sign Up
      </button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <!-- Login Form -->
      <div *ngIf="isLoginMode" class="space-y-5 animate-fade-in-up">
        <div>
          <label class="block text-xs font-bold text-white/70 uppercase tracking-wider mb-2">Email</label>
          <input type="email" name="email" [(ngModel)]="loginData.email" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="you@domain.com">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold text-white/70 uppercase tracking-wider">Password</label>
            <a href="#" class="text-xs text-blue-400 hover:text-blue-300">Forgot?</a>
          </div>
          <input type="password" name="password" [(ngModel)]="loginData.password" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="••••••••">
        </div>
        <button type="submit" [disabled]="isLoading"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4 transition transform hover:scale-[1.02] disabled:opacity-50">
          {{ isLoading ? 'Processing...' : 'Access Account' }}
        </button>
      </div>

      <!-- Register Form -->
      <div *ngIf="!isLoginMode" class="space-y-5 animate-fade-in-up">
        <div>
          <label class="block text-xs font-bold text-white/70 uppercase tracking-wider mb-2">Username</label>
          <input type="text" name="regUsername" [(ngModel)]="registerData.username" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="johndoe">
        </div>
        <div>
          <label class="block text-xs font-bold text-white/70 uppercase tracking-wider mb-2">Email</label>
          <input type="email" name="regEmail" [(ngModel)]="registerData.email" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="you@domain.com">
        </div>
        <div>
          <label class="block text-xs font-bold text-white/70 uppercase tracking-wider mb-2">Password</label>
          <input type="password" name="regPassword" [(ngModel)]="registerData.password" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="Min. 8 characters">
        </div>
        <div>
          <label class="block text-xs font-bold text-white/70 uppercase tracking-wider mb-2">Confirm Password</label>
          <input type="password" name="regConfirm" [(ngModel)]="registerData.confirmPassword" required
                 class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-blue-400 focus:bg-black/40 transition" 
                 placeholder="Repeat password">
        </div>
        <button type="submit" [disabled]="isLoading"
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4 transition transform hover:scale-[1.02] disabled:opacity-50">
          {{ isLoading ? 'Processing...' : 'Create Account' }}
        </button>
      </div>
    </form>

    <div class="mt-auto pt-8 text-center">
      <button type="button" (click)="goBack()" class="text-sm text-white/50 hover:text-white transition">&larr; Return to Store</button>
    </div>
  </div>
</div>

<style>
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.3s ease-out forwards;
  }
</style>
