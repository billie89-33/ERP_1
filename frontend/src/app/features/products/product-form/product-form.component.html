<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">{{ isEditMode ? 'Edit Product' : 'Add New Product' }}</h1>
  <a routerLink="/admin/products" class="text-slate-500 hover:text-slate-700 font-medium">&larr; Back to List</a>
</div>

<div class="bg-white rounded-lg shadow p-6">
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Basic Info -->
      <div class="space-y-4">
        <h3 class="text-lg font-medium text-slate-900 border-b pb-2">Basic Information</h3>
        
        <div>
          <label class="block text-sm font-medium text-slate-700">SKU</label>
          <input type="text" formControlName="sku" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700">Product Name</label>
          <input type="text" formControlName="name" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Category</label>
          <select formControlName="categoryId" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-white">
            <option value="">Select a category</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>
      </div>

      <!-- Pricing & Stock -->
      <div class="space-y-4">
        <h3 class="text-lg font-medium text-slate-900 border-b pb-2">Pricing & Inventory</h3>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Selling Price (฿)</label>
            <input type="number" formControlName="price" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Cost (฿)</label>
            <input type="number" formControlName="cost" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Initial Stock Quantity</label>
          <input type="number" formControlName="stockQuantity" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
      </div>
    </div>

    <!-- Specifications (JSON) -->
    <div class="space-y-4 pt-6 border-t">
      <h3 class="text-lg font-medium text-slate-900">Technical Specifications (JSON)</h3>
      <p class="text-sm text-slate-500">Add dynamic properties here (e.g. RAM, Storage, CPU) to be displayed on the storefront.</p>
      
      <div *ngIf="specError" class="text-sm text-red-600 bg-red-50 p-2 rounded border border-red-200">
        {{ specError }}
      </div>
      
      <textarea [(ngModel)]="specificationsText" [ngModelOptions]="{standalone: true}" rows="8"
        class="font-mono text-sm block w-full border border-slate-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-slate-50"></textarea>
    </div>

    <div class="pt-5 border-t border-slate-200 flex justify-end gap-3">
      <button type="button" routerLink="/admin/products" class="bg-white py-2 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Cancel
      </button>
      <button type="submit" [disabled]="productForm.invalid" class="bg-blue-600 border border-transparent rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-400">
        {{ isEditMode ? 'Update Product' : 'Save Product' }}
      </button>
    </div>
  </form>
</div>
