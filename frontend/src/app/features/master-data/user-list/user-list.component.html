<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">System Users</h1>
  <a routerLink="/admin/master/users/create" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm">
    + Add User
  </a>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
    <div class="relative w-64">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fas fa-search text-slate-400"></i>
      </div>
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" placeholder="Search username, email..." class="pl-10 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md">
    </div>
  </div>

  <div *ngIf="isLoading" class="p-8 text-center text-slate-500">Loading...</div>
  
  <table *ngIf="!isLoading" class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Username</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Role</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Full Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Email</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-slate-200">
      <tr *ngFor="let u of users">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900">{{ u.username }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-purple-100 text-purple-800">
            {{ u.role }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ u.firstName }} {{ u.lastName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ u.email }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <a [routerLink]="['/admin/master/users/edit', u.id]" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</a>
          <button (click)="deleteUser(u.id)" class="text-red-600 hover:text-red-900">Delete</button>
        </td>
      </tr>
      <tr *ngIf="users.length === 0">
        <td colspan="5" class="px-6 py-8 text-center text-slate-500">No Users found.</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Component -->
  <app-pagination 
    *ngIf="!isLoading && totalCount > 0"
    [totalCount]="totalCount" 
    [pageSize]="pageSize" 
    [currentPage]="page" 
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
