<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">Customers</h1>
  <a routerLink="/admin/master/customers/create" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm">
    + Add Customer
  </a>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
    <div class="relative w-64">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fas fa-search text-slate-400"></i>
      </div>
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" placeholder="Search company, tax id..." class="pl-10 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md">
    </div>
  </div>

  <div *ngIf="isLoading" class="p-8 text-center text-slate-500">Loading...</div>
  
  <table *ngIf="!isLoading" class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Type</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Company Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Tax ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Contact</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Credit</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-slate-200">
      <tr *ngFor="let c of customers">
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="c.customerType === 'B2B' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'">
            {{ c.customerType }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">{{ c.companyName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ c.taxId || '-' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-sm text-slate-900">{{ c.email }}</div>
          <div class="text-sm text-slate-500">{{ c.phone }}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 text-right">
          {{ c.creditTermDays }} Days<br>
          <span class="text-xs">Limit: ?{{ c.creditLimit | number:'1.0-0' }}</span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <a [routerLink]="['/admin/master/customers/edit', c.id]" class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</a>
          <button (click)="deleteCustomer(c.id)" class="text-red-600 hover:text-red-900">Delete</button>
        </td>
      </tr>
      <tr *ngIf="customers.length === 0">
        <td colspan="6" class="px-6 py-8 text-center text-slate-500">No Customers found.</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Component -->
  <app-pagination 
    *ngIf="!isLoading && totalCount > 0"
    [totalCount]="totalCount" 
    [pageSize]="pageSize" 
    [currentPage]="page" 
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
