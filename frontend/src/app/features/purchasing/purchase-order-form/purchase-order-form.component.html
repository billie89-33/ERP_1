<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">Create Purchase Order (PO)</h1>
  <a routerLink="/admin/purchase-orders" class="text-slate-500 hover:text-slate-700">Back to List</a>
</div>

<div class="bg-white rounded-lg shadow p-6">
  <form [formGroup]="poForm" (ngSubmit)="onSubmit()">
    
    <!-- Supplier Selection -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-1">Supplier <span class="text-red-500">*</span></label>
      <select formControlName="supplierId" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
        <option value="">Select a Supplier</option>
        <option *ngFor="let s of suppliers" [value]="s.id">{{ s.name }}</option>
      </select>
    </div>

    <hr class="my-6 border-slate-200">

    <h2 class="text-lg font-bold text-slate-800 mb-4">Order Items</h2>
    
    <div formArrayName="items">
      <div *ngFor="let item of items.controls; let i=index" [formGroupName]="i" class="flex items-end gap-4 mb-4 bg-slate-50 p-4 rounded-md border border-slate-200">
        
        <div class="flex-1">
          <label class="block text-xs font-medium text-slate-500 mb-1">Product</label>
          <select formControlName="productId" (change)="onProductSelected(i)" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border text-sm">
            <option value="">Select Product</option>
            <option *ngFor="let p of products" [value]="p.id">{{ p.name }} (Current Cost: {{ p.cost }})</option>
          </select>
        </div>
        
        <div class="w-32">
          <label class="block text-xs font-medium text-slate-500 mb-1">Quantity</label>
          <input type="number" formControlName="quantity" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border text-sm">
        </div>
        
        <div class="w-32">
          <label class="block text-xs font-medium text-slate-500 mb-1">Unit Cost (฿)</label>
          <input type="number" formControlName="unitCost" class="block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border text-sm">
        </div>

        <div class="w-32 text-right">
          <label class="block text-xs font-medium text-slate-500 mb-1">Subtotal (฿)</label>
          <div class="p-2 text-sm font-medium text-slate-800 bg-slate-100 rounded-md border border-slate-200">
            {{ (item.get('quantity')?.value || 0) * (item.get('unitCost')?.value || 0) | number:'1.2-2' }}
          </div>
        </div>

        <button type="button" (click)="removeItem(i)" [disabled]="items.length === 1" class="px-3 py-2 bg-red-100 text-red-600 rounded-md hover:bg-red-200 disabled:opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>

    <button type="button" (click)="addItem()" class="mb-6 text-sm text-blue-600 font-medium hover:text-blue-800 flex items-center">
      + Add Another Item
    </button>

    <div class="flex justify-between items-center pt-4 border-t border-slate-200">
      <div class="text-xl font-bold text-slate-800">
        Grand Total: <span class="text-blue-600">฿{{ getTotal() | number:'1.2-2' }}</span>
      </div>
      <button type="submit" [disabled]="poForm.invalid || isLoading" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 disabled:bg-slate-400 font-medium">
        {{ isLoading ? 'Processing...' : 'Create Purchase Order' }}
      </button>
    </div>
  </form>
</div>
