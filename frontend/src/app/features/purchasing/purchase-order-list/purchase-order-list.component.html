<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">Purchase Orders</h1>
  <a routerLink="/admin/purchase-orders/create" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm">
    + Create PO
  </a>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div *ngIf="isLoading" class="p-8 text-center text-slate-500">
    Loading...
  </div>
  
  <table *ngIf="!isLoading" class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">PO Number</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Date</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Supplier</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Total Amount</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-slate-200">
      <tr *ngFor="let po of purchaseOrders">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">{{ po.poNumber }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ po.orderDate | date:'mediumDate' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ po.supplierName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 font-medium">฿{{ po.totalAmount | number:'1.2-2' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="po.status === 'Received' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
            {{ po.status }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-right">
          <a [routerLink]="['/admin/purchase-orders', po.id]" class="text-blue-600 hover:text-blue-900 font-medium">View</a>
        </td>
      </tr>
      <tr *ngIf="purchaseOrders.length === 0">
        <td colspan="6" class="px-6 py-8 text-center text-slate-500">No Purchase Orders found.</td>
      </tr>
    </tbody>
  </table>
</div>
