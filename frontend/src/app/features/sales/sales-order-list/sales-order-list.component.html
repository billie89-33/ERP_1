<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">Sales Orders</h1>
  <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm">
    + Create SO (WIP)
  </button>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <div *ngIf="isLoading" class="p-8 text-center text-slate-500">
    Loading...
  </div>
  
  <table *ngIf="!isLoading" class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">SO Number</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Date</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Customer</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Total Amount</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-slate-200">
      <tr *ngFor="let so of salesOrders">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">{{ so.soNumber }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ so.orderDate | date:'mediumDate' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ so.customerName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 font-medium">฿{{ so.totalAmount | number:'1.2-2' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
            {{ so.status }}
          </span>
        </td>
      </tr>
      <tr *ngIf="salesOrders.length === 0">
        <td colspan="5" class="px-6 py-8 text-center text-slate-500">No Sales Orders found.</td>
      </tr>
    </tbody>
  </table>
</div>
