<div class="mb-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-slate-800">Sales Orders</h1>
  <div class="flex gap-2">
    <button (click)="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-md shadow-sm flex items-center transition">
      <i class="fas fa-file-excel mr-2"></i> Export Excel
    </button>
    <a routerLink="/admin/sales-orders/create" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm">
      + Create SO
    </a>
  </div>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  
  <!-- Tabs & Search Bar -->
  <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <!-- Filter Tabs -->
    <div class="flex space-x-1 bg-slate-200/50 p-1 rounded-lg">
      <button (click)="setFilter('')" 
              [ngClass]="statusFilter === '' ? 'bg-white shadow text-slate-800' : 'text-slate-600 hover:bg-slate-200'" 
              class="px-4 py-2 text-sm font-medium rounded-md transition-all">
        All Orders
      </button>
      <button (click)="setFilter('Checking')" 
              [ngClass]="statusFilter === 'Checking' ? 'bg-white shadow text-rose-600' : 'text-slate-600 hover:bg-slate-200'" 
              class="px-4 py-2 text-sm font-medium rounded-md transition-all flex items-center gap-2">
        <span *ngIf="statusFilter === 'Checking'" class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
        </span>
        รอตรวจสอบสลิป
      </button>
      <button (click)="setFilter('Paid')" 
              [ngClass]="statusFilter === 'Paid' ? 'bg-white shadow text-emerald-600' : 'text-slate-600 hover:bg-slate-200'" 
              class="px-4 py-2 text-sm font-medium rounded-md transition-all">
        ชำระเงินแล้ว
      </button>
    </div>

    <!-- Search Box -->
    <div class="relative w-full sm:w-64">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fas fa-search text-slate-400"></i>
      </div>
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" placeholder="Search SO Number..." class="pl-10 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-slate-300 rounded-md">
    </div>
  </div>

  <div *ngIf="isLoading" class="p-8 text-center text-slate-500">
    Loading...
  </div>
  
  <table *ngIf="!isLoading" class="min-w-full divide-y divide-slate-200">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">SO Number</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Date</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Customer</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Total Amount</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Payment</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
        <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-slate-200">
      <tr *ngFor="let so of salesOrders">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">
          {{ so.orderNumber }}
          <span *ngIf="so.orderChannel === 'Web'" class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-800">
            Web
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ so.orderDate | date:'mediumDate' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ so.customerName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 font-medium">?{{ so.totalAmount | number:'1.2-2' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-800': so.paymentStatus === 'Checking',
                  'bg-green-100 text-green-800': so.paymentStatus === 'Paid',
                  'bg-slate-100 text-slate-800': so.paymentStatus === 'Pending',
                  'bg-red-100 text-red-800': so.paymentStatus === 'Expired'
                }">
            {{ so.paymentStatus }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-green-100 text-green-800': so.status === 'Shipped',
                  'bg-yellow-100 text-yellow-800': so.status === 'Pending',
                  'bg-red-100 text-red-800': so.status === 'Cancelled'
                }">
            {{ so.status }}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-right">
          <a [routerLink]="['/admin/sales-orders', so.id]" class="text-blue-600 hover:text-blue-900 font-medium">View</a>
        </td>
      </tr>
      <tr *ngIf="salesOrders.length === 0">
        <td colspan="7" class="px-6 py-8 text-center text-slate-500">No Sales Orders found.</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Component -->
  <app-pagination 
    *ngIf="!isLoading && totalCount > 0"
    [totalCount]="totalCount" 
    [pageSize]="pageSize" 
    [currentPage]="page" 
    (pageChange)="onPageChange($event)">
  </app-pagination>
</div>
